<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Surprise ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .photo {
      width: 100%;
      max-width: 600px;
      height: auto;
      display: block;
      position: relative;
      z-index: 1;
    }

    #fireworks {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- YOUR_IMAGE_FILENAME.jpg ko apni image ke exact filename se replace karo -->
  <img class="photo" src="YOUR_IMAGE_FILENAME.jpg" alt="Birthday Surprise">

  <canvas id="fireworks"></canvas>

  <script>
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resize();
    window.addEventListener("resize", resize);

    let particles = [];

    function createFirework(x, y) {
      for (let i = 0; i < 90; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;

        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 90,
          size: Math.random() * 2 + 1
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.life--;

        ctx.globalAlpha = p.life / 90;
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) {
          particles.splice(index, 1);
        }
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(animate);
    }

    animate();

    // Fireworks start automatically
    setTimeout(() => createFirework(innerWidth * 0.20, innerHeight * 0.25), 300);
    setTimeout(() => createFirework(innerWidth * 0.80, innerHeight * 0.25), 800);
    setTimeout(() => createFirework(innerWidth * 0.25, innerHeight * 0.70), 1300);
    setTimeout(() => createFirework(innerWidth * 0.75, innerHeight * 0.70), 1800);
  </script>

</body>
</html>
